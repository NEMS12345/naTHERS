# PlanAssess runtime settings. No compliance targets live here — those are in
# jurisdictions.yaml. These are tool behaviour knobs only.

# Fields with confidence below this threshold (or missing, or config-defaulted)
# are gap-flagged for human review. Configurable; no silent acceptance.
review_confidence_threshold: 0.6

vision_llm:
  # Tier-2 PDF-raster fallback. OFF by default. The tool must run end to end with
  # this disabled; with it off, unresolved fields go to the gap report.
  enabled: false
  model: "claude-sonnet-4-6"
  # Never send the whole plan — only cropped regions still below threshold.
  send_full_plan: false

# External DWG -> DXF converter (P2). Auto-invoked if found on PATH.
oda_file_converter:
  enabled: true
  executable: "ODAFileConverter"

# Method constants for the INDICATIVE simplified heat-balance thermal estimate.
# These are calculation-methodology assumptions (not values extracted from the
# plan); they are logged in the assumptions section of every report.
thermal:
  air_changes_per_hour: 0.7        # assumed infiltration/ventilation rate
  internal_gain_w_per_m2: 4.0      # occupants + appliances, indicative
  heating_utilisation_factor: 0.6  # fraction of gains usefully offsetting heating
  solar_gain_factor: 0.6           # fraction of glazing solar gain reaching the zone
  default_wall_height_m: 2.7       # used only to convert wall lengths to areas when height is known-missing; flagged as an assumption
