[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planassess"
version = "0.0.1"
description = "Indicative NatHERS thermal pre-assessment and jurisdiction-specific sustainability pre-assessment for Australian residential building plans. Pre-assessment and data-prep only — not an official or lodgeable certificate."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PlanAssess" }]
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Ingestion adapters are layered in per phase; kept optional so P0 runs lean.
dxf = ["ezdxf>=1.1", "shapely>=2.0"]              # P1
pdf = ["PyMuPDF>=1.24", "pdfplumber>=0.11"]       # P3
raster = ["opencv-python-headless>=4.9", "pytesseract>=0.3", "numpy>=1.26", "Pillow>=10.0"]  # P4 Tier 1
api = ["anthropic>=0.40"]                          # P4 Tier 2 (optional, off by default)
report = ["reportlab>=4.0"]                        # PDF report output
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
planassess = "planassess.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
