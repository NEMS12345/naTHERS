name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tesseract (raster OCR, P4)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr

      - name: Install PlanAssess (all extras)
        run: pip install -e ".[dev,dxf,pdf,raster,report]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Type-check (mypy, schema package)
        run: mypy

      - name: Run tests with coverage
        run: pytest -q --cov=planassess --cov-report=term-missing --cov-fail-under=80

      - name: CLI end-to-end smoke
        run: bash scripts/smoke.sh out/smoke
